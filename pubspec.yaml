name: dst_server_launcher
description: Independent desktop manager for the official Don't Starve Together Dedicated Server.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^18.1.4
  dio: ^5.11.1
  intl: ^0.20.3
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  phosphor_flutter: ^2.1.0
  file_picker: ^13.4.0
  path_provider: ^2.1.6
  path: ^1.9.1
  archive: ^4.7.1
  window_manager: 0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - l10n/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf

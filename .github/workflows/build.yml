name: Desktop quality and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # A package-only push builds and tests without opening the native app.
      NATIVE_SMOKE: ${{ !contains(github.event.head_commit.message, '[no-launch]') && !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev liblzma-dev libx11-dev libxi-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Windows native smoke test
        timeout-minutes: 8
        if: runner.os == 'Windows' && env.NATIVE_SMOKE == 'true'
        run: flutter test integration_test/desktop_smoke_test.dart -d windows --reporter expanded
      - name: Linux native smoke test
        if: runner.os == 'Linux' && env.NATIVE_SMOKE == 'true'
        run: xvfb-run -a flutter test integration_test/desktop_smoke_test.dart -d linux --reporter expanded
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release
      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release
      - name: Windows release tray and shortcut
        if: runner.os == 'Windows' && env.NATIVE_SMOKE == 'true'
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/windows/test-tray.ps1 -Executable build/windows/x64/runner/Release/dst_server_launcher.exe
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md build/windows/x64/runner/Release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/dst-server-launcher-windows-x64.zip
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' scripts/windows/installer.iss
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp README.md LICENSE THIRD_PARTY_NOTICES.md build/linux/x64/release/bundle/
          cp scripts/linux/{launch.sh,install-dst-server.sh} build/linux/x64/release/bundle/
          cp scripts/linux/install-dst-server.sh dist/
          bash -n dist/install-dst-server.sh
          bash dist/install-dst-server.sh --help
          chmod +x build/linux/x64/release/bundle/launch.sh
          tar -czf dist/dst-server-launcher-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: dst-launcher-${{ runner.os }}-x64
          path: dist/*
          if-no-files-found: error
